apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-fastapi-app # Must match the name in the base deployment
spec:
  template:
    spec:
      containers:
      - name: fastapi-app # Must match the container name (from base/deployment.yaml)
        env:
        - name: DEBUG_MODE
          value: "true"
        resources:
          limits:
            cpu: "500m"  # Increased CPU limit as well, just in case
            memory: "1Gi" # Increased memory limit significantly (1 Gigabyte)
          requests:
            cpu: "250m"
            memory: "512Mi" # Increased memory request
