apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-fastapi-app # Must match the name in the base deployment
spec:
  template:
    spec:
      containers:
      - name: fastapi-app # Must match the container name (from base/deployment.yaml)
        env:
        - name: DEBUG_MODE
          value: "true"
        resources:
          limits:
            cpu: "500m"  # CPU limit remains the same
            memory: "4Gi" # Increased memory limit to 4 Gigabytes
          requests:
            cpu: "250m"
            memory: "2Gi" # Increased memory request to 2 Gigabytes
